name: Bug Report
Description: Report a bug to help us improve CleanBook
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: When I try to process bookmarks with --train flag, it crashes with...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run `cleanbook -i bookmarks.html --train`
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: The bookmarks should be processed and trained...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: The program crashed with error message...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs / Screenshots
      description: Paste any relevant error logs or screenshots
      render: shell

  - type: input
    id: version
    attributes:
      label: CleanBook Version
      description: What version of CleanBook are you using?
      placeholder: e.g., 2.0.1

  - type: dropdown
    id: python
    attributes:
      label: Python Version
      description: What Python version are you using?
      options:
        - "3.10"
        - "3.11"
        - "3.12"
        - Other (specify in environment)

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, dependencies, and other environment details
      placeholder: |
        - OS: Ubuntu 22.04
        - Installation method: pip install cleanbook
        - Config modifications: None

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this bug has not been reported
          required: true
        - label: I can reproduce this bug consistently
          required: false
        - label: I am using the latest version of CleanBook
          required: false
