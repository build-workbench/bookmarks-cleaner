name: Feature Request
Description: Suggest a new feature or enhancement for CleanBook
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please review our [Spec-Driven Development](../CONTRIBUTING.md) process.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when I have to manually categorize...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
      placeholder: Add a new classifier that can automatically detect...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternative solutions or features have you considered?
      placeholder: I tried using the existing ML classifier but...

  - type: textarea
    id: usecase
    attributes:
      label: Use Case
      description: Provide specific examples of how this feature would be used
      placeholder: |
        As a user with 1000+ bookmarks about AI,
        I want to automatically group them by topic,
        So that I can find relevant papers quickly.

  - type: textarea
    id: spec
    attributes:
      label: Spec Proposal
      description: If you have thoughts on the spec design, describe it here
      placeholder: |
        This would require:
        1. New configuration option in config.json
        2. New classifier plugin
        3. Updates to taxonomy schema

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have reviewed the existing specs before proposing
          required: true
        - label: This feature aligns with the project's goals
          required: false
        - label: I am willing to contribute to the implementation
          required: false
