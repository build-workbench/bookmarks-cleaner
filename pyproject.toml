[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanbook"
version = "4.0.0"
description = "离线书签清理与分类：规则优先 · LLM 可选"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "LessUp", email = "github@lessup.dev" }]
keywords = ["bookmarks", "classification", "clean", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = [
  "beautifulsoup4~=4.12.3",
  "lxml~=5.2.2",
  "pyyaml~=6.0.2",
  "chardet~=5.2.0",
]

[project.optional-dependencies]
llm = [
  "requests~=2.32.3",
]
dev = [
  "pytest~=8.2.2",
]

[project.urls]
Repository = "https://github.com/vibe-knight/bookmarks-cleaner"
Issues = "https://github.com/vibe-knight/bookmarks-cleaner/issues"

[project.scripts]
cleanbook = "cleanbook.cli:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["cleanbook*"]

[tool.setuptools.package-data]
"cleanbook.resources" = ["config.json", "taxonomy/*.yaml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers", "--disable-warnings"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
