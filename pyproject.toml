[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanbook"
version = "2.0.0"
description = "智能书签清理与分类：规则+ML+LLM（可选）"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "LessUp", email = "github@lessup.dev" }
]
keywords = [
    "bookmarks",
    "classification",
    "clean",
    "ai",
    "llm",
    "productivity",
    "knowledge-management",
    "bookmark-manager",
    "ml",
    "nlp",
    "automation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Office/Business :: Groupware",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: General",
    "Topic :: Utilities",
    "Typing :: Typed",
]

# 运行依赖（与 requirements.txt 对齐，尽量精简）
dependencies = [
  "beautifulsoup4>=4.12.3",
  "lxml>=5.2.2",
  "numpy>=1.26.4",
  "scikit-learn>=1.4.2",
  "jieba>=0.42.1",
  "langdetect>=1.0.9",
  "matplotlib>=3.9.0",
  "seaborn>=0.13.2",
  "pandas>=2.2.2",
  "requests>=2.32.3",
  "tqdm>=4.66.4",
  "click>=8.1.7",
  "psutil>=6.0.0",
  "joblib>=1.4.2",
  "watchdog>=4.0.2",
  "pyyaml>=6.0.2",
  "jsonschema>=4.23.0",
  "rich>=13.7.1",
  "chardet>=5.2.0",
  "urllib3>=2.0.7"
]

[project.urls]
Homepage = "https://github.com/LessUp/bookmarks-cleaner"
Documentation = "https://lessup.github.io/bookmarks-cleaner/"
Repository = "https://github.com/LessUp/bookmarks-cleaner"
Issues = "https://github.com/LessUp/bookmarks-cleaner/issues"
Changelog = "https://github.com/LessUp/bookmarks-cleaner/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "black>=24.4.2",
  "flake8>=7.0.0",
  "mypy>=1.10.0",
  "types-requests>=2.32.0.20240602",
  "types-PyYAML>=6.0.12.20240311",
  "pytest>=8.2.2",
  "pytest-cov>=5.0.0",
  "hypothesis>=6.0.0",
]

[project.scripts]
# 命令入口（推荐 pipx 安装后直接使用）
cleanbook = "src.cleanbook.cli:main"
cleanbook-wizard = "src.enhanced_cli:main"

[tool.setuptools]
# 包含包和独立模块
py-modules = ["main"]
packages = [
    "src",
    "src.cleanbook",
    "src.core",
    "src.utils",
    "src.cli",
    "src.classifiers",
    "src.engines",
    "src.llm",
    "src.health",
    "src.data",
    "src.plugins",
    "src.plugins.classifiers",
    "src.services",
    "src.resources",
    "src.resources.taxonomy",
    "config",
]

[tool.setuptools.package-data]
# 打包运行时资源与模型
"src" = ["**/*.pkl"]
"src.resources" = ["config.json", "taxonomy/*.yaml"]


# ====================
# Tool Configurations
# ====================

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | docs/node_modules
  | tests/output-.*/
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
known_first_party = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true
exclude = [
    "tests/",
    "docs/",
    ".venv/",
    "venv/",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101", "B601"]  # Skip assert warnings and shell injection in tests

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "property: marks tests as property-based tests",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"
